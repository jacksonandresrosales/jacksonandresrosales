<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Terminal CRT de Jackson Ocaña">
  <defs>
    <clipPath id="type-line">
      <rect x="28" y="48" width="0" height="32">
        <animate attributeName="width" from="0" to="192" begin="0.4s" dur="1.7s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>
    <clipPath id="screen">
      <rect x="1.5" y="1.5" width="877" height="237" rx="12" />
    </clipPath>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000000" opacity="0.30" />
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff7a" stop-opacity="0" />
      <stop offset="0.5" stop-color="#39ff7a" stop-opacity="0.07" />
      <stop offset="1" stop-color="#39ff7a" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.45" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .txt { font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Consolas, 'Courier New', monospace; font-size: 15px; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="877" height="237" rx="12" fill="#050805" stroke="#143614" stroke-width="1.5" />
  <path d="M1.5 13 A11.5 11.5 0 0 1 13 1.5 H866 A11.5 11.5 0 0 1 877.5 13 V37 H1.5 Z" fill="#070b07" />
  <rect x="1.5" y="37" width="876" height="1.5" fill="#143614" />

  <circle cx="30" cy="19.5" r="5.5" fill="#ff5f56" />
  <circle cx="54" cy="19.5" r="5.5" fill="#ffbd2e" />
  <circle cx="78" cy="19.5" r="5.5" fill="#27c93f" />
  <text x="440" y="25" text-anchor="middle" class="txt" font-size="13" fill="#5f8d68">jackson@dev · zsh</text>

  <g clip-path="url(#screen)">
    <text x="28" y="72" class="txt" filter="url(#glow)" textLength="189" clip-path="url(#type-line)">
      <tspan fill="#5cf6ff">jackson@dev:~$ </tspan>
      <tspan fill="#39ff7a">whoami</tspan>
    </text>

    <text x="28" y="102" class="txt" fill="#39ff7a" opacity="0">&gt; ingeniería en software · universidad de guayaquil
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.35s" fill="freeze" />
    </text>

    <text x="28" y="130" class="txt" fill="#2bbf5c" opacity="0">&gt; full-stack: react · next.js · java · spring boot · postgresql
      <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.35s" fill="freeze" />
    </text>

    <text x="28" y="158" class="txt" fill="#2bbf5c" opacity="0">&gt; enfoque: seguridad · datos íntegros · código mantenible
      <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.35s" fill="freeze" />
    </text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.35s" fill="freeze" />
      <text x="28" y="196" class="txt" textLength="144" filter="url(#glow)">
        <tspan fill="#5cf6ff">jackson@dev:~$ </tspan>
      </text>
      <rect x="174" y="182" width="9" height="16" fill="#39ff7a" filter="url(#glow)">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>

    <rect x="2" y="38" width="876" height="199" fill="url(#scanlines)" />
    <rect x="2" y="-46" width="876" height="46" fill="url(#sweep)">
      <animate attributeName="y" from="-46" to="238" dur="7s" repeatCount="indefinite" begin="1s" calcMode="linear" />
    </rect>
    <rect x="2" y="38" width="876" height="199" fill="#39ff7a" opacity="0.02">
      <animate attributeName="opacity" values="0.012;0.035;0.012" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="2" y="38" width="876" height="200" fill="url(#vignette)" />
  </g>
</svg>

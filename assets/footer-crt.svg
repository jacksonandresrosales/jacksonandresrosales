<svg xmlns="http://www.w3.org/2000/svg" width="880" height="72" viewBox="0 0 880 72" role="img" aria-label="Fin del perfil">
  <defs>
    <clipPath id="type">
      <rect x="24" y="18" width="0" height="32">
        <animate attributeName="width" from="0" to="66" begin="0.3s" dur="0.7s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="1" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000000" opacity="0.30" />
    </pattern>
    <style>
      .txt { font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Consolas, 'Courier New', monospace; font-size: 15px; }
    </style>
  </defs>
  <rect x="1" y="1" width="878" height="70" rx="8" fill="#050805" stroke="#143614" stroke-width="1.5" />
  <text x="24" y="47" class="txt" textLength="63" filter="url(#glow)" clip-path="url(#type)">
    <tspan fill="#5cf6ff">~$ </tspan><tspan fill="#39ff7a">exit</tspan>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.3s" fill="freeze" />
    <rect x="93" y="34" width="9" height="15" fill="#39ff7a" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="2" y="2" width="876" height="68" rx="7" fill="url(#scan)" />
</svg>
